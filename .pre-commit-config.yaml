# Run the same checks as the CI before each commit:
#   pip install pre-commit && pre-commit install
# Keep the versions in sync with the `dev` extra in pyproject.toml.
repos:
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
        files: ^(qalma|test|tools)/
