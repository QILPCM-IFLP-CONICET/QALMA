name: Check docstrings and documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  docstrings:
    name: Auditoría de docstrings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install doc tools
        run: pip install interrogate pydocstyle

      - name: Cobertura de docstrings (interrogate)
        # fail-under en 0 para que reporte sin bloquear por ahora.
        # Subir gradualmente a 60, 80, 100 a medida que se completan.
        run: |
          interrogate qalma/ \
            --verbose \
            --fail-under 90 \
            --ignore-magic \
            --ignore-semiprivate

      - name: Estilo NumPy (pydocstyle)
        # Sólo reporta, no bloquea (|| true). Quitar cuando el estilo esté limpio.
        run: |
          pydocstyle qalma/ --convention=numpy || true

  notebooks:
    # Executes every notebook in docs/examples, including those stored with
    # outputs (which the Sphinx build renders without running them), so a
    # change that breaks an example fails here.
    name: Notebooks de ejemplo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install QALMA + nbmake
        run: |
          pip install --upgrade pip
          pip install -e ".[plot]" pytest nbmake

      - name: Execute the notebooks
        # Fails on the first error of each notebook, or if a notebook takes
        # more than the timeout (seconds).
        run: python -m pytest --nbmake --nbmake-timeout=900 docs/examples

  docs:
    name: Build de documentación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          pandoc-version: '3.1.1' # Optional: defaults to latest

      - name: Install QALMA + doc dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build Sphinx docs (warnings como errores)
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going"

      - name: Upload HTML docs como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-html
          path: docs/_build/html/
          retention-days: 7
