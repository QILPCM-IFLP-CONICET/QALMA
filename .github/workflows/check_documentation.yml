name: Check docstrings and documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get install pandoc
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest test/ -v --tb=short

  docstrings:
    name: Auditoría de docstrings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install doc tools
        run: pip install interrogate pydocstyle

      - name: Cobertura de docstrings (interrogate)
        # fail-under en 0 para que reporte sin bloquear por ahora.
        # Subir gradualmente a 60, 80, 100 a medida que se completan.
        run: |
          interrogate qalma/ \
            --verbose \
            --fail-under 90 \
            --ignore-magic \
            --ignore-semiprivate

      - name: Estilo NumPy (pydocstyle)
        # Sólo reporta, no bloquea (|| true). Quitar cuando el estilo esté limpio.
        run: |
          pydocstyle qalma/ --convention=numpy || true

  docs:
    name: Build de documentación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install QALMA + doc dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build Sphinx docs (warnings como errores)
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going"

      - name: Upload HTML docs como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-html
          path: docs/_build/html/
          retention-days: 7
