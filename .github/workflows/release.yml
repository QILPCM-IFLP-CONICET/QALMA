# Publishes QALMA on PyPI when a GitHub release is published.
#
# It uses PyPI "trusted publishing" (no API tokens). Before the first
# release, register this repository and workflow as a trusted publisher in
# the PyPI project settings, and create a `pypi` environment in the
# repository settings. See https://docs.pypi.org/trusted-publishers/

name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*
    - name: Check that the tag matches the package version
      run: |
        version=$(python -c "exec(open('qalma/version.py').read()); print(__version__)")
        test "v$version" = "$GITHUB_REF_NAME" || {
          echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    name: Publish on PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
