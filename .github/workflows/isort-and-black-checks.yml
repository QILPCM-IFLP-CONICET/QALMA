# Checks that the code follows the formatting conventions of the project
# (`make conventions` applies them locally).

name: isort, black, ruff and mypy checks
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Keep the pins in sync with the `dev` extra in pyproject.toml.
      - name: Install black, isort, ruff and mypy
        run: pip install 'black==24.10.0' 'isort==6.0.1' ruff mypy
      - name: Run isort --check .
        run: isort --check .
      - name: Run check Black
        run: black --diff .
      - name: Run black --check
        run: black --check .
      - name: Run ruff check
        run: ruff check qalma test tools
      - name: Run mypy
        run: |
          pip install -e .
          mypy --install-types --non-interactive qalma
