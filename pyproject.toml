[build-system]
# setuptools>=77 is needed for SPDX license expressions (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qalma"
version = "1.0.0"
authors = [
    { name="Juan Mauricio Matera", email="matera@fisica.unlp.edu.ar" }
]
description = "Quantum Algebras for Lattice Models and Applications."
readme = "README.rst"
requires-python = ">=3.10"
# QALMA itself is LGPL-3.0; the ALPS model/lattice libraries shipped in
# qalma/lib/*.xml are distributed under the Boost Software License 1.0.
# The LGPL-3.0 is a set of additional permissions on top of the GPL-3.0,
# so both texts (COPYING.LESSER and COPYING) have to be distributed.
license = "LGPL-3.0-only AND BSL-1.0"
license-files = [
    "COPYING",
    "COPYING.LESSER",
    "qalma/lib/LICENSE_1_0.txt",
]
# Lower bounds are the oldest versions the test suite has been run against.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "qutip>=5.1",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "packaging",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "http://www.fisica.unlp.edu.ar/Members/matera/english-version/mauricio-materas-personal-home-page"
Repository = "https://github.com/QILPCM-IFLP-CONICET/QALMA"
Issues = "https://github.com/QILPCM-IFLP-CONICET/QALMA/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "interrogate",
    "pydocstyle",
    # Formatters are pinned to the versions used by the CI checks.
    "black==24.10.0",
    "isort==6.0.1",
    "ruff",
    "mypy",
    "codespell",
]
# Needed by the `make benchmark-*` targets.
bench = [
    "pytest-benchmark",
    "pytest-profiling",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "sphinx-autodoc-typehints",
    "nbsphinx",          # para ejecutar notebooks como páginas
    "myst-parser",       # si se usan archivos .md además de .rst
    "ipython",
    "ipykernel",
]

# ── Empaquetado ──────────────────────────────────────────────────────────────
# Sólo se instala el paquete `qalma`: `test`, `tools`, `docs` y `examples`
# quedan fuera del wheel.
[tool.setuptools.packages.find]
include = ["qalma*"]

[tool.setuptools.package-data]
"qalma" = [
    "lib/*.xml",
    "lib/LICENSE_1_0.txt",
]

# ── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "benchmark: performance benchmarks (need the `bench` extra and BENCHMARKS=1)",
]

# ── Formato ──────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
combine_as_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["examples", "docs"]

[tool.ruff.lint]
# Conjunto explícito de reglas, para que el resultado no dependa de los
# valores por defecto de cada versión de ruff. Ampliar gradualmente.
select = ["E", "F", "W"]
ignore = ["E501"]  # el largo de línea lo maneja black

# ── Configuración de interrogate ─────────────────────────────────────────────
[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = true        # ignora __repr__, __str__, etc.
ignore-semiprivate = false
ignore-private = false
fail-under = 80             # subir gradualmente: 40 → 60 → 80 → 100
verbose = 1
quiet = false
color = true


# ── Configuración de pydocstyle ───────────────────────────────────────────────
[tool.pydocstyle]
convention = "numpy"
# D100-D107: docstrings faltantes (los reporta interrogate, no duplicar aquí)
# D205: falta línea en blanco después del resumen (muy ruidoso al inicio)
add-ignore = ["D105", "D107", "D205"]
