[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qalma"
version = "1.0.0"
authors = [
    { name="Juan Mauricio Matera", email="matera@fisica.unlp.edu.ar" }
]
description = "Quantum Algebras for Lattice Models and Applications."
readme = "README.rst"
requires-python = ">=3.7"
license = { file = "LICENSE.txt" }
dependencies = [
    "matplotlib",
    "qutip",
    "h5py",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

[tool.setuptools.package-data]
"qalma" = [
    "lib/*.xml",
]

[project.urls]
Homepage = "http://www.fisica.unlp.edu.ar/Members/matera/english-version/mauricio-materas-personal-home-page"


# Dependencias opcionales (si no existen ya, crear la tabla [project.optional-dependencies])
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "interrogate",
    "pydocstyle",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "nbsphinx",          # para ejecutar notebooks como páginas
    "myst-parser",       # si se usan archivos .md además de .rst
    "sphinx-rtd-theme",
    "ipython",
]
 
# ── Configuración de interrogate ─────────────────────────────────────────────
[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = true        # ignora __repr__, __str__, etc.
ignore-semiprivate = false
ignore-private = false
fail-under = 80             # subir gradualmente: 40 → 60 → 80 → 100
verbose = 1
quiet = false
color = true


# ── Configuración de pydocstyle ───────────────────────────────────────────────
[tool.pydocstyle]
convention = "numpy"
# D100-D107: docstrings faltantes (los reporta interrogate, no duplicar aquí)
# D205: falta línea en blanco después del resumen (muy ruidoso al inicio)
add-ignore = ["D105", "D107", "D205"]
